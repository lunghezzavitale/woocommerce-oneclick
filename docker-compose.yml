services:
 wordpress:
   build:
     context: .
     dockerfile: Dockerfile
   container_name: woocommerce-wordpress
   volumes:
     - ./wordpress:/var/www/html
   environment:
     - WORDPRESS_DB_NAME=woocommerce
     - WORDPRESS_DB_HOST=woocommerce-db
     - WORDPRESS_DB_USER=root
     - WORDPRESS_DB_PASSWORD=password
     - WORDPRESS_URL=http://localhost:8080
     - WORDPRESS_ADMIN_USER=admin
     - WORDPRESS_ADMIN_PASSWORD=password
     - WORDPRESS_ADMIN_EMAIL=youremail@mail.com
     - WOOCOMMERCE_STORE_COUNTRY=US:NJ
     - WOOCOMMERCE_CURRENCY=USD
     - WOOCOMMERCE_GENERATE_DATA=true
   restart: always
   ports:
     - 8080:80
 
 db:
   image: mariadb:11.4
   container_name: woocommerce-db
   volumes:
     - db_data:/var/lib/mysql
   environment:
     - MYSQL_ROOT_PASSWORD=password
     - MYSQL_USER=root
     - MYSQL_PASSWORD=password
     - MYSQL_DATABASE=woocommerce
   restart: always
 
volumes:
 db_data: